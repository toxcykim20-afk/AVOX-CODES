<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AVOX TRADING</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lightweight-charts@4.1.0/dist/lightweight-charts.standalone.production.js"></script>
<style>
body{background:#000;color:#fff;font-family:Inter,sans-serif}
.card{background:#1A1A1A}
.green-bar{background:#0F3D26}
.icon-bg{background:#2A2A2A}
</style>
</head>
<body>
<div class="max-w-[430px] mx-auto min-h-screen flex flex-col">

<!-- TOP REAL BADGE -->
<div class="flex justify-center pt-2"><span class="bg-[#1DB954] text-[11px] px-4 py-1 rounded-full font-bold">Real</span></div>

<!-- PHASE: TRADE (Chart) -->
<div id="phase-trade" class="phase flex-1">
<div class="flex justify-between p-4"><b class="tracking-[3px] text-[13px]">AVOX TRADING</b><span id="price" class="text-[#7FFF7F] font-bold text-[13px]">$--</span></div>
<div id="chart" class="w-full h-[60vh] bg-[#0f0f1f]"></div>
<div class="flex gap-2 p-3"><button onclick="trade('BUY')" class="bg-[#22c55e] w-1/2 py-5 rounded-xl font-black">BUY</button><button onclick="trade('SELL')" class="bg-[#ef4444] w-1/2 py-5 rounded-xl font-black">SELL</button></div>
<p id="status" class="text-center text-[12px] text-yellow-300 h-4"></p>
</div>

<!-- PHASE: FUNDS - EXACT LIKE YOUR SCREENSHOT -->
<div id="phase-funds" class="phase flex-1 p-4" style="display:block">
<!-- Equity Card -->
<div class="card rounded-2xl p-5">
<div class="flex justify-between"><span class="text-[#9A9A9A] text-[14px]">Equity</span><span class="w-6 h-6 rounded-full border border-[#3A3A3A] flex items-center justify-center text-[12px]">i</span></div>
<div class="text-[28px] font-bold mt-1">$<span id="equity">0.00</span></div>
<div class="mt-5 space-y-2 text-[13px]">
<div class="flex justify-between"><span class="text-[#9A9A9A]">Balance</span><span id="balText">$0.00</span></div>
<div class="flex justify-between"><span class="text-[#9A9A9A]">Free margin</span><span id="marginText">$0.00</span></div>
<div class="flex justify-between mt-3"><span class="text-[#9A9A9A]">Pending deposit</span><span id="pendingText" class="font-bold">+$759.16</span></div>
</div>
</div>

<!-- Deposit Withdraw Green Bar -->
<div class="green-bar rounded-2xl mt-4 flex p-4">
<button onclick="openDeposit()" class="flex-1 flex flex-col items-center gap-2"><span class="w-10 h-10 bg-white rounded-full flex items-center justify-center text-black text-[20px] font-bold">+</span><span class="text-[13px] font-bold">Deposit</span></button>
<button onclick="openWithdraw()" class="flex-1 flex flex-col items-center gap-2"><span class="w-10 h-10 bg-white rounded-full flex items-center justify-center text-black text-[20px]">↑</span><span class="text-[13px] font-bold">Withdraw</span></button>
</div>

<!-- Transaction History -->
<div class="mt-6">
<p class="text-[#9A9A9A] text-[13px]">Today</p>
<div id="todayList" class="mt-2 space-y-4"></div>

<p class="text-[#9A9A9A] text-[13px] mt-8">June 10, 2026</p>
<div class="mt-3 space-y-4">
<div class="flex justify-between items-center">
<div class="flex gap-3 items-center"><div class="relative"><div class="icon-bg w-11 h-11 rounded-full flex items-center justify-center">↑</div><span class="absolute -bottom-1 -right-1 bg-[#22c55e] w-5 h-5 rounded-full flex items-center justify-center text-[10px]">✓</span></div><div><div class="font-bold text-[14px]">Withdrawal</div><div class="text-[#9A9A9A] text-[12px]">Mobile Money MPesa</div></div></div>
<div class="font-bold text-[14px]">-$6.33</div>
</div>
<div class="flex justify-between items-center">
<div class="flex gap-3 items-center"><div class="relative"><div class="icon-bg w-11 h-11 rounded-full flex items-center justify-center">+</div><span class="absolute -bottom-1 -right-1 bg-[#22c55e] w-5 h-5 rounded-full flex items-center justify-center text-[10px]">✓</span></div><div><div class="font-bold text-[14px]">Deposit</div><div class="text-[#9A9A9A] text-[12px]">Mobile Money MPesa</div></div></div>
<div class="font-bold text-[14px]">+$6.06</div>
</div>
</div>
</div>
</div>

<!-- PHASE: POSITIONS -->
<div id="phase-positions" class="phase flex-1 p-4 hidden"><h2 class="font-bold">Open Positions</h2><div id="posList" class="mt-4 text-[12px] text-[#9A9A9A]">No open trades yet</div></div>

<!-- PHASE: MORE -->
<div id="phase-more" class="phase flex-1 p-4 hidden">
<button class="w-full bg-[#1A1A1A] p-4 rounded-xl text-left mt-2">📅 Economic Calendar</button>
<button class="w-full bg-[#1A1A1A] p-4 rounded-xl text-left mt-2">👤 Profile & Security</button>
<button onclick="localStorage.clear();location.reload()" class="w-full bg-[#1A1A1A] p-4 rounded-xl text-left mt-2">Logout</button>
</div>

<!-- BOTTOM NAV - SAME AS SCREENSHOT -->
<div class="grid grid-cols-4 border-t border-[#222] py-2 text-center bg-black sticky bottom-0">
<button onclick="showPhase('trade')" id="nav-trade" class="flex flex-col items-center opacity-60"><span class="text-[22px]">📈</span><span class="text-[11px] mt-1">Trade</span></button>
<button onclick="showPhase('positions')" id="nav-positions" class="flex flex-col items-center opacity-60"><span class="text-[22px]">📋</span><span class="text-[11px] mt-1">Positions</span></button>
<button onclick="showPhase('funds')" id="nav-funds" class="flex flex-col items-center text-[#1DB954]"><span class="text-[22px]">💳</span><span class="text-[11px] mt-1">Funds</span></button>
<button onclick="showPhase('more')" id="nav-more" class="flex flex-col items-center opacity-60"><span class="text-[22px]">⋯</span><span class="text-[11px] mt-1">More</span></button>
</div>
</div>

<script>
// --- NAV LOGIC ---
function showPhase(p){
document.querySelectorAll('.phase').forEach(e=>e.style.display='none');
document.getElementById('phase-'+p).style.display='block';
document.querySelectorAll('[id^=nav-]').forEach(e=>{e.classList.remove('text-[#1DB954]');e.classList.add('opacity-60')});
document.getElementById('nav-'+p).classList.add('text-[#1DB954]');
document.getElementById('nav-'+p).classList.remove('opacity-60');
if(p=='trade' && chart) setTimeout(()=>chart.timeScale().fitContent(),100);
}
let bal = parseFloat(localStorage.getItem('avox_bal')||'0');
let pending = parseFloat(localStorage.getItem('avox_pending')||'759.16');
let history = JSON.parse(localStorage.getItem('avox_hist')||'[]');
function renderHistory(){
let html = '';
if(history.length==0){
// Default from screenshot - pending
html = `
<div class="flex justify-between items-center"><div class="flex gap-3 items-center"><div class="relative"><div class="icon-bg w-11 h-11 rounded-full flex items-center justify-center">+</div><span class="absolute -bottom-1 -right-1 bg-red-500 w-5 h-5 rounded-full flex items-center justify-center text-[10px]">✕</span></div><div><div class="font-bold text-[14px]">Deposit</div><div class="text-[#9A9A9A] text-[12px]">Mobile Money</div></div></div><div class="font-bold text-[14px]">+$759.16</div></div>
<div class="flex justify-between items-center"><div class="flex gap-3 items-center"><div class="relative"><div class="icon-bg w-11 h-11 rounded-full flex items-center justify-center">+</div><span class="absolute -bottom-1 -right-1 bg-[#2A2A2A] w-5 h-5 rounded-full flex items-center justify-center text-[9px]">◷</span></div><div><div class="font-bold text-[14px]">Deposit</div><div class="text-[#9A9A9A] text-[12px]">Mobile Money</div></div></div><div class="font-bold text-[14px]">+$759.16</div></div>
`;
}else{
history.forEach(h=>{
html+=`<div class="flex justify-between items-center"><div class="flex gap-3 items-center"><div class="relative"><div class="icon-bg w-11 h-11 rounded-full flex items-center justify-center">${h.type=='Withdrawal'?'↑':'+'}</div><span class="absolute -bottom-1 -right-1 ${h.status=='ok'?'bg-[#22c55e]':'bg-[#2A2A2A]'} w-5 h-5 rounded-full flex items-center justify-center text-[10px]">${h.status=='ok'?'✓':'◷'}</span></div><div><div class="font-bold text-[14px]">${h.type}</div><div class="text-[#9A9A9A] text-[12px]">Mobile Money MPesa</div></div></div><div class="font-bold text-[14px]">${h.amount}</div></div>`;
});
}
document.getElementById('todayList').innerHTML = html;
document.getElementById('balText').innerText = '$' + bal.toFixed(2);
document.getElementById('equity').innerText = bal.toFixed(2);
document.getElementById('marginText').innerText = '$' + bal.toFixed(2);
document.getElementById('pendingText').innerText = '+$' + pending.toFixed(2);
}
renderHistory();

function openDeposit(){
let amt = prompt('Enter deposit amount USD:','50');
if(!amt) return;
pending += parseFloat(amt);
let entry = {type:'Deposit', amount:'+$'+parseFloat(amt).toFixed(2), status:'wait'};
history.unshift(entry);
localStorage.setItem('avox_pending',pending);
localStorage.setItem('avox_hist',JSON.stringify(history));
renderHistory();
alert('Deposit request created - Pending +$' + amt);
}
function openWithdraw(){
if(bal<5) return alert('Insufficient balance');
let amt = prompt('Withdraw amount:','10');
if(!amt) return;
bal -= parseFloat(amt);
history.unshift({type:'Withdrawal', amount:'-$'+parseFloat(amt).toFixed(2), status:'ok'});
localStorage.setItem('avox_bal',bal);
localStorage.setItem('avox_hist',JSON.stringify(history));
renderHistory();
}

// --- REAL CHART ---
let price=0, candleData=[], candleSeries;
let chart = LightweightCharts.createChart(document.getElementById('chart'),{layout:{background:{color:'#0f0f1f'},textColor:'#888'},grid:{vertLines:{color:'#1a1a2a'},horzLines:{color:'#1a1a2a'}},width:430,height:400});
candleSeries = chart.addCandlestickSeries({upColor:'#22c55e',downColor:'#ef4444',borderVisible:false,wickUpColor:'#22c55e',wickDownColor:'#ef4444'});
async function load(){let r=await fetch('https://api.binance.com/api/v3/klines?symbol=BTCUSDT&interval=1m&limit=100');let j=await r.json();candleData=j.map(k=>({time:k[0]/1000,open:+k[1],high:+k[2],low:+k[3],close:+k[4]}));candleSeries.setData(candleData);price=candleData.at(-1).close;document.getElementById('price').innerText='$'+price.toFixed(2);chart.timeScale().fitContent();
setInterval(async()=>{try{let r2=await fetch('https://api.binance.com/api/v3/ticker/price?symbol=BTCUSDT');price=+((await r2.json()).price);document.getElementById('price').innerText='$'+price.toFixed(2);let last=candleData.at(-1);last.close=price;if(price>last.high)last.high=price;if(price<last.low)last.low=price;candleSeries.update(last);}catch(e){}},2000);
}
load();
function trade(dir){
document.getElementById('status').innerText = dir + ' OPEN @ $' + price.toFixed(2) + ' - 8 sec';
setTimeout(()=>{
let win = Math.random()>0.4; let profit = win? 5 : -5; bal+=profit;
localStorage.setItem('avox_bal',bal); renderHistory();
document.getElementById('status').innerText = win? 'WIN +$'+profit : 'LOSS $'+profit;
document.getElementById('posList').innerHTML = `<div>${dir} ${win?'WIN':'LOSS'} $${profit}</div>` + document.getElementById('posList').innerHTML;
},8000);
}
showPhase('funds');
</script>
</body>
</html>
